<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3569A8" />
      <stop offset="100%" stop-color="#14243A" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14243A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Circular Base Background -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBgGrad)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Outer Decorative Ring -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Developer Silhouette / Professional Portrait Placeholder -->
  <g filter="url(#subtleShadow)">
    <!-- Shoulders / Torso with Professional Collar -->
    <path d="M 90 350 C 90 270, 140 245, 200 245 C 260 245, 310 270, 310 350 Z" fill="#14243A" />
    
    <!-- Shirt Collar (V-neck / Professional cut) -->
    <polygon points="175,245 200,285 225,245" fill="#3569A8" opacity="0.9" />
    <polygon points="188,245 200,270 212,245" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="180" y="200" width="40" height="50" rx="4" fill="#E2E8F0" />
    
    <!-- Head Base -->
    <ellipse cx="200" cy="165" rx="55" ry="65" fill="#CBD5E1" />
    
    <!-- Hair Silhouette (Professional, clean cut) -->
    <path d="M 140 160 C 140 100, 165 90, 200 90 C 235 90, 260 100, 260 160 C 255 130, 230 115, 200 115 C 170 115, 145 130, 140 160 Z" fill="#14243A" />
    
    <!-- Modern Minimalist Glasses Accent -->
    <rect x="160" y="150" width="30" height="20" rx="4" fill="none" stroke="#14243A" stroke-width="3" />
    <rect x="210" y="150" width="30" height="20" rx="4" fill="none" stroke="#14243A" stroke-width="3" />
    <line x1="190" y1="160" x2="210" y2="160" stroke="#14243A" stroke-width="3" />
  </g>

  <!-- Code Symbol Accent Badge (bottom right) -->
  <g transform="translate(280, 280)">
    <circle cx="28" cy="28" r="26" fill="#3569A8" stroke="#FFFFFF" stroke-width="3" />
    <!-- Code Bracket Icon -->
    <path d="M 23 20 L 16 28 L 23 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 20 L 40 28 L 33 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
